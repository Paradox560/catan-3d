# Vercel web-config deployments use docs/VERCEL.md, not this Render blueprint.
# Render uses the legacy Admin connection with a server-only service-account secret.
# No new paid resources are requested by this Blueprint. Firebase quotas/billing still apply.
# For durable live rooms, select a paid web-service plan and uncomment disk below.
# Review current plans and costs in your Render account before deploying.
services:
  - type: web
    name: catan-3d
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: CATAN_DATA_DIR
        value: /app/server/data
      - key: RANKINGS_STORAGE
        value: firestore
      - key: FIREBASE_AUTH_MODE
        value: admin
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: inventory-management-6626b
      - key: FIRESTORE_RANKINGS_DOCUMENT
        value: catan/rankings
      - key: RANKINGS_ADMIN_PASSWORD
        sync: false
      - key: RANKINGS_ADMIN_USERNAME
        sync: false
    # Optional: add ALLOWED_ORIGINS in the dashboard if your reverse proxy
    # changes the Host header. Set it to the exact public https:// origin.
    #
    # Paid persistence: change plan above to a paid plan, e.g. 0.5c-512mb,
    # then uncomment this disk. Keep exactly one service instance.
    # disk:
    #   name: catan-room-data
    #   mountPath: /app/server/data
    #   sizeGB: 1
